name: FkcGame
version: '1.0.0'
main: com.fkc.game.FkcGamePlugin
api-version: '1.21'
author: fkc
description: 多合一小遊戲插件，目前內建完整規則日本立直麻將；未來可以繼續往裡面加其他遊戲模組
folia-supported: true
softdepend: [Vault]

commands:
  mahjong:
    description: Mahjong game commands
    usage: /mahjong <create|join|leave|ready|start|bot|destroy|info|list|action>
    aliases: [mj, majiang]
  uno:
    description: UNO card game commands
    usage: /uno <create|join|leave|ready|start|bot|destroy|info|list|action>
    aliases: [u]

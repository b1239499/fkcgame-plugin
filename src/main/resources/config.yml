# FkcGame 設定
#
# 這個插件設計成可以容納多款小遊戲，每款遊戲的設定各自放在自己的
# 頂層區塊底下（例如 mahjong: 這一段），避免以後加新遊戲時設定互相打架。

mahjong:
  # 每一局麻將的規則預設值，開桌時套用這些數值
  rules:
    game-length: EAST_ONLY          # EAST_ONLY(東風戰) 或 EAST_SOUTH(東南戰)
    min-han: 1                      # 最低幾翻才能胡牌
    red-five-count-per-suit: 1      # 每色赤五張數，0 = 不用赤寶牌
    thinking-time-seconds: 15       # 吃碰槓胡提示視窗秒數
    starting-score: 25000           # 每人起始點數
    exchange-three-default: false   # 開桌預設是否開啟換三張

  # 台灣麻將（十六張）專屬設定，用 /mahjong create taiwan 開桌時套用。
  # 台數表沒有全國統一標準，這裡是常見版本之一，覺得跟你們牌桌習慣不同
  # 的話直接改下面數字即可，不用重新編譯。
  taiwan-rules:
    min-tai: 1              # 最低幾台才能胡牌，設 0 就是允許「屁胡」（0 台也能胡）
    # 底分：不管台數多少，胡牌時「一律」先加這筆分數，是台數之外額外
    # 獨立的分數來源。現實牌桌常見「底跟台的比例」大約是 3:1（例如底
    # 30、1台10），但這完全是牌桌自己約定的習慣，沒有標準答案，你可以
    # 自己抓一個跟 points-per-tai 搭配起來合理的比例。預設 0 = 沒有
    # 底分（維持沒有這個功能之前的行為，屁胡贏了只拿 0 分）。
    base-points: 0
    points-per-tai: 100     # 每台值多少點
    starting-score: 1000    # 每人起始點數（跟日麻的 starting-score 分開設定）
    dealer-multiplier: 2    # 莊家胡牌/自摸點數倍率
    tai:
      menzen: 1               # 門清
      tsumo: 1                # 自摸
      menzen-tsumo-bonus: 1   # 門清+自摸同時成立時，額外多加的台數
      ping-hu: 2               # 平胡
      dui-dui-hu: 4            # 對對胡
      san-an-ke: 2             # 三暗刻
      si-an-ke: 5              # 四暗刻
      wu-an-ke: 16             # 五暗刻
      hun-yi-se: 4             # 混一色
      qing-yi-se: 8            # 清一色
      zi-yi-se: 16             # 字一色
      xiao-san-yuan: 4         # 小三元
      da-san-yuan: 8           # 大三元
      xiao-si-xi: 8            # 小四喜
      da-si-xi: 16             # 大四喜
      feng-ke: 1               # 風牌刻子（自風/場風，各算一次）
      jian-ke: 1               # 箭牌刻子（中發白，各算一次）
      gang-bonus: 1            # 每宣告一次槓，額外加的台數
      flower-each: 1           # 每張花牌（非成套時）
      flower-full-set-bonus: 2 # 集滿同一組花（春夏秋冬 或 梅蘭竹菊）的加成，取代逐張計算
      flower-all-eight-bonus: 8 # 集滿全部 8 張花的加成

  # 公開資訊要不要「額外」廣播給全伺服器所有在線玩家看到（不是只有同桌
  # 4 人）。同桌玩家永遠都看得到這些訊息，這裡只控制要不要順便也讓沒
  # 加入牌桌的其他人看到，每種訊息類型可以獨立開關。
  # 手牌內容本身完全不受這裡影響，永遠只有玩家自己看得到。
  broadcast-to-server:
    round-start: false   # 每一局開始的公告（例如「新的一局開始！東1局 0本場」）
    discard: false       # 每次有人打牌的公告（例如「XXX 打出了 5萬」）
    call: false           # 每次有人吃/碰/明槓/暗槓的公告
    win: false             # 自摸、榮和、宣告失敗的公告
    draw: false           # 流局（牌摸完了）的公告
    game-end: false      # 對局結束的名次公告，以及牌桌重置的提示
    exchange: false       # 台麻「換三張」開始/完成的公告

  # 等待中的牌桌超過幾分鐘沒開始就自動解散（避免列表堆積殭屍桌）
  table-idle-timeout-minutes: 5

  # 誰能開桌、開桌要不要收費
  table-creation:
    permission: ''    # 需要的權限節點，留空 = 所有玩家都能開桌
    fee: 0             # 開桌費（透過 Vault 經濟系統扣款），0 = 免費，
                        # 沒裝 Vault 這個設定會被忽略，開桌一律免費

  # 開桌成功時，要不要廣播給全伺服器所有在線玩家（點擊可直接加入），
  # 方便大家發現有新桌子可以加入，不用一直手動查 /mahjong list
  announce-table-creation: true

  # 排行榜（日麻/台麻分開計分，各自累積淨輸贏點數）。
  # 有電腦玩家的桌子完全不計分。麻將本身是零和遊戲（贏家拿的點數 =
  # 輸家扣掉的點數，總量不變），這是防止刷分數的主要機制——兩個帳號
  # 對打，其中一方要故意放水讓另一方分數上升，自己的分數一定會等量
  # 下降，不是無成本的。
  leaderboard:
    max-ranked-matches-per-day: 20   # 每人每天最多幾場對局計入排行榜，0 = 不限制

  # 遊戲進行中要不要在畫面右側顯示即時計分板（顯示局數、輪到誰、手牌
  # 張數、最新棄牌、寶牌指標、你的分數）。預設關閉（不自動顯示），
  # 玩家要自己打 /mahjong sidebar（或中文別名 面板/側邊欄）才會出現，
  # 再打一次關掉。這裡的設定只是伺服器層級的預設值，玩家個人開關會
  # 覆蓋過去。
  sidebar-enabled: false

  # 牌面預設要顯示文字還是圖示（需要伺服器有裝好對應的 ItemsAdder 資源
  # 包，玩家才看得到正確圖案，否則會顯示成方塊或亂碼）。預設 false =
  # 文字。玩家自己打 /mahjong tiles（或中文別名 圖示）可以個人切換，
  # 玩家個人的選擇會蓋過這裡的伺服器預設值。
  tiles-image-default: false

  # 第一名獎品：一場麻將結束（正常打完或有人分數歸負提早結束），排序
  # 後分數最高的那個人會拿到 /mahjong setreward 設定的物品。台麻跟日麻
  # 各自獨立設定、獨立計算每日次數，完全不會互相影響（跟排行榜的拆法
  # 一樣）。daily-limit：-1（預設值）跟 0 都代表不限制，想真的限制
  # 次數要改成正整數（例如設 3 就是一天最多發 3 次，超過就不再發放）。
  reward:
    riichi:
      daily-limit: -1
      enabled: true      # 總開關，關掉之後即使有設定獎品物品也完全不會發放，也不會佔用每日次數
      # 有人拿到獎品時，要不要額外廣播「XXX 在日本立直麻將拿到本場第一名，
      # 獲得獎品！」這則訊息給「全伺服器所有在線玩家」看到（不限桌上的人）。
      # 關掉這個只是不對外廣播，得獎者自己「拿到獎品」的私人訊息一定都會
      # 收到，不受這個開關影響。
      announce: true
    taiwan:
      daily-limit: -1
      enabled: true
      # 有人拿到獎品時，要不要額外廣播「XXX 在台灣麻將拿到本場第一名，
      # 獲得獎品！」這則訊息給「全伺服器所有在線玩家」看到（不限桌上的人）。
      # 關掉這個只是不對外廣播，得獎者自己「拿到獎品」的私人訊息一定都會
      # 收到，不受這個開關影響。
      announce: true

uno:
  rules:
    starting-hand-size: 7      # 開局每人發幾張牌
    target-score: 500          # 累積到幾分結束整場對局
    thinking-time-seconds: 30  # 每回合思考時間（目前僅供顯示參考，尚未強制計時淘汰）
    uno-catch-penalty: 2       # 忘記喊 UNO 被抓到，罰摸幾張

  # 公開資訊要不要「額外」廣播給全伺服器所有在線玩家（同桌玩家永遠都看
  # 得到，這裡只控制要不要順便讓沒加入牌桌的其他人也看到）
  broadcast-to-server:
    round-start: false   # 每一輪開始的公告（起始牌、起始顏色）
    play: false             # 每次有人出牌的公告（例如「XXX 出了 紅5」）
    draw: false             # 目前保留但尚未實際使用，暫時沒有任何訊息會用到這個分類
    special: false        # 跳過/反轉/罰摸/喊UNO/抓包/等待提醒 等特殊事件
    win: false               # 有人出完手牌獲勝的公告
    game-end: false      # 對局結束的名次公告，以及牌桌重置的提示

  table-idle-timeout-minutes: 5

  table-creation:
    permission: ''
    fee: 0

  # 開桌成功時，要不要廣播給全伺服器所有在線玩家（點擊可直接加入）
  announce-table-creation: true

  # 排行榜。UNO 天生不是零和遊戲（輸家分數不會自動倒扣），所以額外用
  # 下面兩個設定補防刷分：強制最低人數、輸家扣一點小額懲罰，讓「故意
  # 放水讓某個帳號一直贏」這件事不是完全沒成本。有電腦玩家的桌子完全
  # 不計分。
  leaderboard:
    max-ranked-matches-per-day: 20   # 每人每天最多幾場對局計入排行榜，0 = 不限制
    min-players-for-ranking: 3       # 至少幾位真人玩家，這場才會計入排行榜
    loser-penalty: 20                # 沒贏的玩家，排行榜分數扣多少

  # 遊戲進行中要不要在畫面右側顯示即時計分板（顯示牌面、顏色、輪到誰、
  # 各家手牌張數、你的分數）。預設關閉（不自動顯示），玩家要自己打
  # /uno sidebar（或中文別名 面板/側邊欄）才會出現，再打一次關掉。
  # 這裡的設定只是伺服器層級的預設值，玩家個人開關會覆蓋過去。
  sidebar-enabled: false

  # 牌面預設要顯示文字還是圖示（需要伺服器有裝好對應的 ItemsAdder 資源
  # 包，玩家才看得到正確圖案，否則會顯示成方塊或亂碼）。預設 false =
  # 文字。玩家自己打 /uno tiles（或中文別名 圖示）可以個人切換，玩家
  # 個人的選擇會蓋過這裡的伺服器預設值。
  tiles-image-default: false

  # 第一名獎品：誰先達到目標分數結束比賽，就拿到 /uno setreward 設定
  # 的物品。這裡設定 UNO 自己一天最多發幾次（跟麻將是分開各自計算
  # 的，不會互相影響）。-1（預設值）代表不限制，0 也一樣代表不限制；
  # 想真的限制次數的話要改成正整數（例如設 3 就是一天最多發 3 次，
  # 超過就不再發放）。
  reward-daily-limit: -1
  # 要不要開啟 UNO 的第一名獎品功能（總開關，關掉之後即使有設定獎品
  # 物品也完全不會發放，也不會佔用每日次數）。
  reward-enabled: true
  # 有人拿到獎品時，要不要額外廣播「XXX 在 UNO 拿到本場第一名，獲得
  # 獎品！」這則訊息給「全伺服器所有在線玩家」看到（不限桌上的人）。
  # 關掉這個只是不對外廣播，得獎者自己「拿到獎品」的私人訊息一定都會
  # 收到，不受這個開關影響。
  reward-announce: true
